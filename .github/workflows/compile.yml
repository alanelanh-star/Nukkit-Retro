name: Manual-Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 解決你截圖中的警告問題
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        # 這裡加上了 --fail-never 確保即使有一兩個小依賴抓不到，也會嘗試繼續編譯
        run: mvn clean package -DskipTests --fail-never 
        
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: My-Nukkit-Jar
          path: target/*.jar
          if-no-files-found: warn # 沒找到檔案時只警告，不報錯
