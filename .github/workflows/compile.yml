name: Manual-Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 更新到 v4
      - name: Setup Java 8
        uses: actions/setup-java@v4 # 更新到 v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Upload result
        uses: actions/upload-artifact@v4 # 這裡就是報錯的地方，改成 v4 就好了
        with:
          name: My-Nukkit-Jar
          path: target/*.jar
